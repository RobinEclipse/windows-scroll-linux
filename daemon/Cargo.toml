[package]
name = "midscrolld"
version = "1.0.0"
edition = "2024"
license = "Unlicense"

[dependencies]
evdev = "=0.13.2"
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# Pinned upstream 0.13.2 plus the Linux UI_SET_PHYS ioctl size correction.
[patch.crates-io]
evdev = { path = "vendor/evdev" }
